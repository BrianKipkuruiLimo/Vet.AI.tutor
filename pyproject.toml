[project]
name = "vet-ai-tutor"
version = "2.1.0"
description = "Offline veterinary tutor using local RAG (Chroma + BM25) and Ollama models"
readme = "README.md"
requires-python = ">=3.10"
# Runtime dependencies. uv.lock pins exact versions; requirements.txt is
# generated from it (`uv export`, see README) for pip and the offline bundle.
dependencies = [
    # RAG pipeline
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",   # FAISS / HuggingFace fallbacks
    "langchain-ollama>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-chroma>=0.2.0",
    "chromadb>=0.5.0",
    "ollama>=0.4.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
    # Document loaders (no PyTorch). pypdfium2 is BSD-3/Apache-2.0 licensed.
    "pypdfium2>=4.30.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    # API and UI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",      # FastAPI file uploads (knowledge patches)
    # Developer ingestion: web harvesting
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    # Knowledge-patch signatures (Ed25519)
    "cryptography>=42.0.0",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",       # FastAPI TestClient
    "ruff>=0.17.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "pillow>=10.0.0",      # page rendering for scripts/ocr_scanned_pdfs.py
    "streamlit>=1.40.0",   # developer dashboard only; not shipped to students
]
eval = [
    "ragas>=0.3",
]

[tool.uv]
# The app is run from the source tree, not installed as a package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "data", "archive"]

[tool.ruff.lint]
# pyflakes, pycodestyle errors, import sorting is left alone to keep diffs small;
# bugbear catches likely bugs; UP keeps syntax current.
select = ["E", "F", "W", "B", "UP"]
ignore = [
    "E501",   # long lines: formatter-free codebase, enforced loosely via line-length
    "UP006", "UP035", "UP045", "UP007",  # typing.List/Optional style is used throughout
    "B008",   # FastAPI's Depends()/File() in defaults is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
# Scripts adjust sys.path before importing the package.
"scripts/*" = ["E402"]
"tests/*" = ["B017"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["vet_ai_tutor"]
