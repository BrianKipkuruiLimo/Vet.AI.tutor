<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vet AI Tutor — Chat</title>
    <meta name="description" content="Veterinary AI Tutor — Ask veterinary questions and get sourced answers from your local knowledge base.">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-primary: #0f1117;
            --bg-secondary: #1a1d27;
            --bg-chat: #141620;
            --bg-user-msg: #2d5a3d;
            --bg-bot-msg: #1e2233;
            --bg-input: #1a1d27;
            --text-primary: #e8eaed;
            --text-secondary: #9aa0a6;
            --text-muted: #6b7280;
            --accent: #4ade80;
            --accent-dim: #22c55e33;
            --border: #2a2d3a;
            --border-focus: #4ade80;
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
            --radius: 12px;
            --radius-sm: 8px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            font-size: 28px;
            filter: drop-shadow(0 0 8px rgba(74,222,128,0.3));
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4ade80, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s;
        }

        .btn-icon:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
        }

        /* Status bar */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            transition: background 0.3s;
        }

        .status-dot.connected { background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,0.5); }
        .status-dot.loading { background: #f59e0b; animation: pulse 1s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Chat area */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        /* Welcome screen */
        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 20px;
            opacity: 0.9;
        }

        .welcome-icon {
            font-size: 64px;
            filter: drop-shadow(0 0 20px rgba(74,222,128,0.2));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .welcome h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .welcome p {
            color: var(--text-secondary);
            max-width: 400px;
            line-height: 1.6;
        }

        .welcome-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-width: 600px;
            margin-top: 8px;
        }

        .suggestion-chip {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .suggestion-chip:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
            transform: translateY(-1px);
        }

        /* Messages */
        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.bot { align-self: flex-start; }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            margin-top: 4px;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        }

        .message.bot .message-avatar {
            background: linear-gradient(135deg, #4ade80, #22d3ee);
        }

        .message-content {
            padding: 12px 16px;
            border-radius: var(--radius);
            line-height: 1.6;
            font-size: 0.9rem;
        }

        .message.user .message-content {
            background: var(--bg-user-msg);
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-content {
            background: var(--bg-bot-msg);
            border-bottom-left-radius: 4px;
        }

        .message-content p { margin-bottom: 8px; }
        .message-content p:last-child { margin-bottom: 0; }
        .message-content strong { color: var(--accent); }
        .message-content code {
            background: rgba(255,255,255,0.08);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.85em;
        }

        /* Sources accordion */
        .sources-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            padding: 4px 10px;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sources-toggle:hover { color: var(--accent); border-color: var(--accent); }
        .sources-list { display: none; margin-top: 8px; font-size: 0.78rem; color: var(--text-secondary); }
        .sources-list.open { display: block; }
        .source-item { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .source-item:last-child { border-bottom: none; }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-4px); }
        }

        /* Follow-ups */
        .followups {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
            animation: fadeIn 0.4s ease;
        }

        .followup-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .followup-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
        }

        /* Input area */
        .input-area {
            padding: 16px 24px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            max-width: 900px;
            margin: 0 auto;
        }

        .input-field {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 16px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            outline: none;
            transition: border-color 0.2s;
            line-height: 1.5;
        }

        .input-field:focus { border-color: var(--border-focus); }
        .input-field::placeholder { color: var(--text-muted); }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: var(--radius);
            border: none;
            background: linear-gradient(135deg, #4ade80, #22d3ee);
            color: #0f1117;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover { transform: scale(1.05); box-shadow: 0 0 16px rgba(74,222,128,0.3); }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        .input-hint {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .header { padding: 12px 16px; }
            .chat-container { padding: 16px; }
            .input-area { padding: 12px 16px; }
            .message { max-width: 95%; }
            .welcome-suggestions { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <span class="header-icon">🐄</span>
            <div>
                <h1>Vet AI Tutor</h1>
                <div class="header-subtitle">Local RAG · BGE-M3 · ChromaDB</div>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-icon" id="knowledgeUpdateBtn" title="Update Knowledge Base">⬆️</button>
            <button class="btn-icon" id="clearBtn" title="Clear chat">🗑️</button>
            <button class="btn-icon" id="docsBtn" title="API Docs" onclick="window.open('/docs','_blank')">📄</button>
        </div>
    </header>

    <!-- Status bar -->
    <div class="status-bar">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Connecting...</span>
    </div>

    <!-- Chat messages -->
    <main class="chat-container" id="chatContainer">
        <div class="welcome" id="welcomeScreen">
            <span class="welcome-icon">🐄</span>
            <h2>Welcome to Vet AI Tutor</h2>
            <p>Ask any veterinary question — powered by your local knowledge base with 18,000+ document chunks.</p>
            <div class="welcome-suggestions">
                <button class="suggestion-chip" onclick="askQuestion(this.textContent)">What is milk fever in cattle?</button>
                <button class="suggestion-chip" onclick="askQuestion(this.textContent)">How is mastitis diagnosed?</button>
                <button class="suggestion-chip" onclick="askQuestion(this.textContent)">What are the signs of babesiosis?</button>
                <button class="suggestion-chip" onclick="askQuestion(this.textContent)">Explain canine parvovirus treatment</button>
            </div>
        </div>
    </main>

    <!-- Input area -->
    <div class="input-area">
        <div class="input-wrapper">
            <textarea
                class="input-field"
                id="questionInput"
                placeholder="Ask a veterinary question..."
                rows="1"
            ></textarea>
            <button class="send-btn" id="sendBtn" title="Send">➤</button>
        </div>
        <div class="input-hint">Press Enter to send · Shift+Enter for new line</div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        const chatContainer = document.getElementById('chatContainer');
        const questionInput = document.getElementById('questionInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const knowledgeUpdateBtn = document.getElementById('knowledgeUpdateBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const welcomeScreen = document.getElementById('welcomeScreen');

        let isStreaming = false;

        // Auto-resize textarea
        questionInput.addEventListener('input', () => {
            questionInput.style.height = 'auto';
            questionInput.style.height = Math.min(questionInput.scrollHeight, 120) + 'px';
        });

        // Enter to send, Shift+Enter for newline
        questionInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);
        clearBtn.addEventListener('click', clearChat);
        knowledgeUpdateBtn.addEventListener('click', updateKnowledgeBase);

        // Check health on load
        checkHealth();

        async function checkHealth() {
            try {
                const res = await fetch(`${API_BASE}/health`);
                const data = await res.json();
                if (data.vectorstore_loaded) {
                    statusDot.className = 'status-dot connected';
                    statusText.textContent = `Connected · ${data.model} · vectorstore loaded`;
                } else {
                    statusDot.className = 'status-dot loading';
                    statusText.textContent = 'API running but vectorstore not loaded';
                }
            } catch {
                statusDot.className = 'status-dot';
                statusText.textContent = 'Cannot reach API — is the server running?';
            }
        }

        function askQuestion(text) {
            questionInput.value = text;
            sendMessage();
        }

        async function sendMessage() {
            const question = questionInput.value.trim();
            if (!question || isStreaming) return;

            // Hide welcome
            if (welcomeScreen) welcomeScreen.style.display = 'none';

            // Add user message
            addMessage('user', question);
            questionInput.value = '';
            questionInput.style.height = 'auto';

            // Show typing indicator
            const botMsg = addMessage('bot', '', true);
            isStreaming = true;
            sendBtn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/ask_stream`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question, remember: true }),
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({ detail: res.statusText }));
                    throw new Error(err.detail || 'Server error');
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    fullText += decoder.decode(value, { stream: true });
                    updateBotMessage(botMsg, fullText);
                }

                // Fetch sources for the last response
                fetchSources(question, botMsg);

                // Fetch follow-ups
                fetchFollowups(question, fullText, botMsg);

            } catch (err) {
                updateBotMessage(botMsg, `⚠️ Error: ${err.message}`);
            } finally {
                isStreaming = false;
                sendBtn.disabled = false;
                questionInput.focus();
            }
        }

        async function fetchSources(question, botMsgEl) {
            try {
                const res = await fetch(`${API_BASE}/ask`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question, remember: false }),
                });
                if (!res.ok) return;
                const data = await res.json();
                if (data.sources && data.sources.length > 0) {
                    const contentEl = botMsgEl.querySelector('.message-content');
                    const sourcesHtml = `
                        <div class="sources-toggle" onclick="this.nextElementSibling.classList.toggle('open')">
                            📚 ${data.sources.length} source(s) ▾
                        </div>
                        <div class="sources-list">
                            ${data.sources.map(s => {
                                let tierBadge = '';
                                if (s.source_tier === 'tier_1') tierBadge = '<span style="color:#4ade80;font-size:0.7rem;">● Tier 1</span>';
                                else if (s.source_tier === 'tier_2') tierBadge = '<span style="color:#f59e0b;font-size:0.7rem;">● Tier 2</span>';
                                else if (s.source_tier === 'tier_3') tierBadge = '<span style="color:#ef4444;font-size:0.7rem;">● Tier 3</span>';

                                let meta = '';
                                if (s.species) meta += `<span style="color:var(--text-muted);font-size:0.72rem;"> · ${s.species}</span>`;
                                if (s.topic) meta += `<span style="color:var(--text-muted);font-size:0.72rem;"> · ${s.topic}</span>`;
                                const citation = [s.author, s.journal, s.publication_year, s.page ? `p. ${s.page}` : '', s.slide ? `slide ${s.slide}` : ''].filter(Boolean).join(' · ');
                                if (citation) meta += `<span style="color:var(--text-muted);font-size:0.72rem;"> · ${citation}</span>`;

                                let link = s.source;
                                if (s.source_url && s.source_url.startsWith('http')) {
                                    link = `<a href="${s.source_url}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline;">${s.source}</a>`;
                                }

                                return `<div class="source-item">📄 ${link}${s.chunk != null ? ` #${s.chunk}` : ''} ${tierBadge}${meta}</div>`;
                            }).join('')}
                        </div>
                    `;
                    contentEl.insertAdjacentHTML('beforeend', sourcesHtml);
                }
            } catch {}
        }

        async function fetchFollowups(question, answer, botMsgEl) {
            try {
                const res = await fetch(`${API_BASE}/followups`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question, answer: answer.slice(0, 300), num: 3 }),
                });
                if (!res.ok) return;
                const data = await res.json();
                if (data.followups && data.followups.length > 0) {
                    const contentEl = botMsgEl.querySelector('.message-content');
                    const followHtml = `
                        <div class="followups">
                            ${data.followups.map(f =>
                                `<button class="followup-btn" onclick="askQuestion('${f.replace(/'/g, "\\'")}')">${f}</button>`
                            ).join('')}
                        </div>
                    `;
                    contentEl.insertAdjacentHTML('beforeend', followHtml);
                }
            } catch {}
        }

        function addMessage(role, text, isLoading = false) {
            const el = document.createElement('div');
            el.className = `message ${role}`;
            const avatar = role === 'user' ? '👤' : '🐄';
            el.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">
                    ${isLoading
                        ? '<div class="typing-indicator"><span></span><span></span><span></span></div>'
                        : formatText(text)
                    }
                </div>
            `;
            chatContainer.appendChild(el);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return el;
        }

        function updateBotMessage(el, text) {
            const contentEl = el.querySelector('.message-content');
            contentEl.innerHTML = formatText(text);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function formatText(text) {
            // Basic markdown-like formatting
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`(.*?)`/g, '<code>$1</code>')
                .replace(/\[S(\d+)\]/g, '<strong>[S$1]</strong>')
                .replace(/\n/g, '<br>');
        }

        async function clearChat() {
            chatContainer.innerHTML = '';
            if (welcomeScreen) {
                chatContainer.appendChild(welcomeScreen);
                welcomeScreen.style.display = '';
            }
            try {
                await fetch(`${API_BASE}/reset`, { method: 'POST' });
            } catch {}
        }

        async function updateKnowledgeBase() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.zip,application/zip';
            input.onchange = async () => {
                const patch = input.files && input.files[0];
                if (!patch) return;
                const token = window.prompt('Developer token:');
                if (!token) return;
                knowledgeUpdateBtn.disabled = true;
                statusText.textContent = 'Validating knowledge update…';
                try {
                    const body = new FormData();
                    body.append('patch', patch);
                    const res = await fetch(`${API_BASE}/knowledge/update`, {
                        method: 'POST',
                        headers: { 'X-Admin-Token': token },
                        body,
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || 'Update failed');
                    statusText.textContent = `Knowledge base updated · ${data.version}`;
                    await checkHealth();
                } catch (err) {
                    statusText.textContent = `Knowledge update failed: ${err.message}`;
                } finally {
                    knowledgeUpdateBtn.disabled = false;
                }
            };
            input.click();
        }
    </script>
</body>
</html>
